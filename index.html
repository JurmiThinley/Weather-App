<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <form id="search-form">
            <input type="text" id="city-input" placeholder="Enter city name..." required />
            <button type="submit">Search</button>
        </form>

        <div class="weather-card">
            <div class="weather-header">
                <img src="" alt="Weather Icon" id="weather-icon" />
                <h2 id="location">Unable to Fetch Weather</h2>
                <p class="desc">No Information Available</p>
            </div>
            <div class="temperature">
                <span class="c">Error °C</span>
                <span class="divider">|</span>
                <span class="f">Error °F</span>
            </div>
            <div class="info">
                <div>
                    <h4>Sunrise</h4>
                    <p class="sunrise">No Information Available</p>
                </div>
                <div>
                    <h4>Sunset</h4>
                    <p class="sunset">No Information Available</p>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>


</html>
